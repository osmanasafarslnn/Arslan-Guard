name: Arslan Guard
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Eğer projeniz bir alt klasördeyse buraya klasör adını yazın (örn: working-directory: ./MyProject)
    # Eğer kök dizindeyse alt klasör ayarına gerek yoktur.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # Proje alt klasördeyse aşağıdaki satırın başındaki '#' işaretini kaldırıp klasör adını yazın:
        # working-directory: ./AltKlasorAdiniz

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        # working-directory: ./AltKlasorAdiniz

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arslan-Guard-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
